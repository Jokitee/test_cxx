%YAML:1.0
Camera:
  mode: "video"                 # "camera" (真实相机) 或 "video" (视频测试)
  video_path: "demo/video1.mp4"   # 当 mode 为 "video" 时生效
  exposure_time: 5000
  gain_r: 100
  gain_g: 70
  gain_b: 50

Modules:
  enable_detector: 1     # 1=开启灯条检测
  enable_classifier: 1   # 1=开启神经网络数字识别 (若为0则默认全部视为 "1" 号)
  enable_pnp: 1          # 1=开启 3D 位姿解算与模型优化
  enable_serial: 0       # 1=开启串口发包

Serial:
  port_name: "COM3"
  baud_rate: 115200

Detector:
  thresh_val: 150
  area_min: 50.0
  area_max: 9000.0
  ratio_min: 4.0
  ratio_max: 18.0
  angle_min: 5.0
  angle_max: 175.0
  distance_min: 1.0
  distance_max: 2.6

UI:
  show_window: 1       # 1=显示窗口, 0=关闭窗口(无头模式运行)
  draw_3d_box: 1      # 1=绘制车辆 3D 优化边框
  draw_2d_id: 1        # 1=绘制装甲板 2D 识别数字
  draw_lightbars: 1    # 1=绘制所有检测到的灯条

Planner:
  # === 目标评分权重 ===
  w_dist: 0.40              # 距离权重
  w_angle: 0.35             # 角度(正对程度)权重
  w_conf: 0.20              # 跟踪置信度权重
  w_threat: 0.05            # 威胁度权重 (留作后续扩展)

  # === 装甲板选择参数 ===
  switch_threshold: 0.35    # (rad) 超过此阈值即开始寻找衔接的下一块板
  min_effective_angle: 0.70 # (rad) 有效装甲板硬性上限角度

  # === 目标筛选与过滤条件 ===
  max_lost_frames: 10       # 最大允许的丢失帧数
  max_cov_trace: 100.0      # 协方差矩阵的迹的最大允许值，用于判断收敛
  max_range: 15.0           # (m) 有效射程上限
  max_normal_angle: 1.57    # (rad) 装甲板最大允许背对角度 (1.57 即 pi/2)

  # === 决策与状态机参数 ===
  lambda: 0.2               # 目标切换惩罚值，防止频繁在多个目标间跳变
  base_thresh: 0.05         # (rad) 判定目标锁定的基础角度容忍阈值
  min_lock_frames: 5        # 进入 LOCKED (稳定锁定) 状态所需的最小连续稳定帧数

  # === 输出平滑与限幅 ===
  alpha: 0.3                # 一阶低通滤波系数 (0 = 无平滑，1 = 完全保持上一帧)
  max_rate: 10.0            # (rad/s) 云台最大允许的角速度变化率限幅

